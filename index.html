<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<title>Temple Website</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f5f5f5;
}

/* HEADER */
header {
  background: orange;
  color: white;
  text-align: center;
  padding: 15px;
  font-size: 22px;
}

/* NAVBAR */
nav {
  background: #ddd;
  text-align: center;
  padding: 10px;
}

nav a {
  margin: 10px;
  color: blue;
  font-weight: bold;
  text-decoration: none;
}

/* CONTAINER */
.container {
  padding: 10px;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 10px;
}

/* CARD */
.card {
  background: white;
  padding: 5px;
  border-radius: 10px;
  text-align: center;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.card img, video {
  width: 100%;
  height: 120px;
  object-fit: cover;
  border-radius: 8px;
}

select {
  padding: 8px;
  margin: 5px;
}
</style>
</head>

<body>

<header>
🙏 రాఘవరాజపురం హిందూ కుటుంబానికి స్వాగతం 🙏
</header>

<nav>
<a href="#">Year</a>
<a href="#">Festivals</a>
<a href="#">Photos</a>
<a href="#">Videos</a>
<a href="#">Donations</a>
<a href="#">Bills</a>
</nav>

<div class="container">

<h3>Select Year</h3>

<select id="year" onchange="loadFestivals()">
  <option value="">Select Year</option>
  <option value="2025">2025</option>
  <option value="2026">2026</option>
</select>

<select id="festival" onchange="loadAllData()">
  <option value="">Select Festival</option>
</select>

<h3>Photos</h3>
<div id="photos" class="grid"></div>

<h3>Videos</h3>
<div id="videos" class="grid"></div>

<h3>Donations</h3>
<ul id="donations"></ul>

<h3>Bills</h3>
<ul id="bills"></ul>

</div>

<script>

/* 🔥 MAIN DATA */
const data = {

  "2025": {
    "Sankranthi": {
      photos: [
        "images/2025/sankranthi/img1.jpg",
        "images/2025/sankranthi/img2.jpg"
      ],
      videos: [
        "videos/2025/sankranthi/v1.mp4"
      ],
      donations: [
        "Ravi - ₹500",
        "Suresh - ₹1000"
      ],
      bills: [
        "Lights - ₹300",
        "Sound - ₹500"
      ]
    },

    "Vinayaka": {
      photos: [
        "images/2025/vinayaka/img1.jpg"
      ],
      videos: [],
      donations: [
        "Ramesh - ₹700"
      ],
      bills: [
        "Decoration - ₹800"
      ]
    }
  },

  "2026": {
    "Sankranthi": {
      photos: [
        "images/2026/sankranthi/img1.jpg"
      ],
      videos: [],
      donations: [
        "Kiran - ₹900"
      ],
      bills: [
        "Lights - ₹400"
      ]
    }
  }

};

/* 🔹 LOAD FESTIVALS */
function loadFestivals() {
  const year = document.getElementById("year").value;
  const festDropdown = document.getElementById("festival");

  festDropdown.innerHTML = "<option>Select Festival</option>";

  if(data[year]) {
    Object.keys(data[year]).forEach(f => {
      let opt = document.createElement("option");
      opt.value = f;
      opt.text = f;
      festDropdown.appendChild(opt);
    });
  }
}

/* 🔹 LOAD ALL DATA */
function loadAllData() {

  const year = document.getElementById("year").value;
  const fest = document.getElementById("festival").value;

  if(!data[year] || !data[year][fest]) return;

  const d = data[year][fest];

  /* PHOTOS */
  const photoDiv = document.getElementById("photos");
  photoDiv.innerHTML = "";

  d.photos.forEach(p => {
    let img = document.createElement("img");
    img.src = p;

    let card = document.createElement("div");
    card.className = "card";
    card.appendChild(img);

    photoDiv.appendChild(card);
  });

  /* VIDEOS */
  const videoDiv = document.getElementById("videos");
  videoDiv.innerHTML = "";

  d.videos.forEach(v => {
    let vid = document.createElement("video");
    vid.src = v;
    vid.controls = true;

    let card = document.createElement("div");
    card.className = "card";
    card.appendChild(vid);

    videoDiv.appendChild(card);
  });

  /* DONATIONS */
  const don = document.getElementById("donations");
  don.innerHTML = "";

  d.donations.forEach(x => {
    let li = document.createElement("li");
    li.innerText = x;
    don.appendChild(li);
  });

  /* BILLS */
  const bill = document.getElementById("bills");
  bill.innerHTML = "";

  d.bills.forEach(x => {
    let li = document.createElement("li");
    li.innerText = x;
    bill.appendChild(li);
  });

}

/* 🔹 DEFAULT LOAD */
window.onload = () => {
  document.getElementById("year").value = "2025";
  loadFestivals();
};

</script>

</body>
</html>
