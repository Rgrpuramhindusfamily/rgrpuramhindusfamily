<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<title>రాఘవరాజపురం హిందూ కుటుంబం</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f5f5f5;
}

header {
  background: orange;
  color: white;
  text-align: center;
  padding: 15px;
}

section {
  background: white;
  margin: 10px;
  padding: 15px;
  border-radius: 10px;
}

button {
  padding: 10px;
  margin: 5px;
  background: orange;
  color: white;
  border: none;
}

img {
  width: 150px;
  margin: 5px;
  border-radius: 10px;
}
</style>

</head>

<body>

<header>
<h1>🙏 రాఘవరాజపురం హిందూ కుటుంబానికి స్వాగతం 🙏</h1>
</header>

<!-- YEAR -->
<section>
<h2>Select Year</h2>
<button onclick="loadFestivals('2025')">2025</button>
<button onclick="loadFestivals('2024')">2026</button>
</section>

<!-- FESTIVALS -->
<section>
<h2>Festivals</h2>
<div id="festivals"></div>
</section>

<!-- PHOTOS -->
<section>
<h2>Photos</h2>
<div id="photos"></div>
</section>

<!-- DONATIONS -->
<section>
<h2>Donations</h2>
<ul>
<li>AAA - ₹500</li>
<li>BBB - ₹1000</li>
</ul>
</section>

<!-- BILLS -->
<section>
<h2>Bills</h2>
<ul>
<li>Lights - ₹300</li>
<li>Decoration - ₹700</li>
<li>Speakers - ₹1000</li>
</ul>
</section>

<!-- FAMILIES -->
<section>
<h2>Families</h2>
<ul>
<li>Family 1</li>
<li>Family 2</li>
<li>Family 3</li>
</ul>
</section>

<script>

const data = {
  "2025": {
    "Sankranthi": [
      "images/2025/sankranthi/pongal26.jpeg",
      "images/2025/sankranthi/img2.jpg"
    ], 
    "thirunal": [
      "images/2025/thirunal/img1.jpg"
      "images/2025/thirunal/img2.jpeg"
      "images/2025/thirunal/img3.jpeg"
      "images/2025/thirunal/img4.jpeg"
      "images/2025/thirunal/img5.jpeg"
    ]
    "Vinayaka": [
      "images/2025/vinayaka/img1.jpg"
      "images/2025/vinayaka/img2.jpeg"
      "images/2025/vinayaka/img3.jpeg"
      "images/2025/vinayaka/img4.jpeg"
      "images/2025/vinayaka/img5.jpeg"
    ]
  }
};

function loadFestivals(year) {
  const div = document.getElementById("festivals");
  div.innerHTML = "";

  Object.keys(data[year]).forEach(fest => {
    const btn = document.createElement("button");
    btn.innerText = fest;
    btn.onclick = () => loadPhotos(year, fest);
    div.appendChild(btn);
  });
}

function loadPhotos(year, fest) {
  const div = document.getElementById("photos");
  div.innerHTML = "";

  data[year][fest].forEach(imgPath => {
    const img = document.createElement("img");
    img.src = imgPath;
    div.appendChild(img);
  });
}

</script>

</body>
</html>
