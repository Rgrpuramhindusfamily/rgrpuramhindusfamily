<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<title>Temple UI</title>

<style>
body { font-family: Arial; margin:0; background:#eee; }

/* HEADER */
header {
  background: orange;
  color:white;
  text-align:center;
  padding:15px;
  font-size:22px;
}

/* NAV */
nav {
  background:#ccc;
  text-align:center;
  padding:10px;
}
nav a {
  margin:10px;
  color:blue;
  font-weight:bold;
}

/* MAIN LAYOUT */
.main {
  display:flex;
}

/* LEFT PANEL */
.left {
  width:250px;
  padding:10px;
}

/* RIGHT PANEL */
.right {
  flex:1;
  padding:10px;
}

/* GRID */
.grid {
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(120px,1fr));
  gap:10px;
}

/* CARD */
.card {
  background:white;
  padding:5px;
  border-radius:10px;
  text-align:center;
}

.card img {
  width:100%;
  height:100px;
  object-fit:cover;
  border-radius:8px;
}

.category {
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
  font-weight:bold;
  height:100px;
  border-radius:10px;
}

.fellow { background:orange; }
.master { background:skyblue; }
.architect { background:#1976d2; }
.tech { background:#ff7043; }

select { padding:5px; margin:5px; }

</style>
</head>

<body>

<header>
🙏 రాఘవరాజపురం హిందూ కుటుంబానికి స్వాగతం 🙏
</header>

<nav>
<a>Year</a>
<a>Festivals</a>
<a>Families</a>
<a>Photos</a>
<a>Videos</a>
<a>Donations</a>
<a>Bills</a>
</nav>

<div class="main">

<!-- LEFT SIDE -->
<div class="left">

<h3>Select Year</h3>

<select id="year" onchange="loadFestivals()">
<option value="2025">2025</option>
<option value="2026">2026</option>
</select>

<select id="festival" onchange="loadData()">
<option>Select Festival</option>
</select>

<h3>Donations</h3>
<ul id="donations"></ul>

<h3>Bills</h3>
<ul id="bills"></ul>

</div>

<!-- RIGHT SIDE -->
<div class="right">
<div id="grid" class="grid"></div>
</div>

</div>

<script>

/* 🔥 MAIN DATA */
const data = {

"2025": {
  "Vinayaka": {
    items: [
      {img:"TempleWebsite/images/p1.jpg", name:"Jyothish"},
      {img:"TempleWebsite/images/p2.jpg", name:"Kishore"},
      {img:"TempleWebsite/images/p3.jpg", name:"Praveen"},
      {img:"TempleWebsite/images/p4.jpg", name:"Naveen"},
      {img:"TempleWebsite/images/p5.jpg", name:"Umakanth"},
      {img:"TempleWebsite/images/p6.jpg", name:"Kiran"},
      {img:"TempleWebsite/images/p7.jpg", name:"Ambareesh"},
      {img:"TempleWebsite/images/p8.jpg", name:"Mothi"},
      {img:"TempleWebsite/images/p9.jpg", name:"Gokul"},
      {img:"TempleWebsite/images/p10.jpg", name:"Narendra"},
      {img:"TempleWebsite/images/p11.jpg", name:"Thulasi"},
      {img:"TempleWebsite/images/p12.jpg", name:"Sarath"},
      {img:"TempleWebsite/images/p13.jpg", name:"Anji"},
      {img:"TempleWebsite/images/p14.jpg", name:"Nithin"},
      {img:"TempleWebsite/images/p15.jpg", name:"Vinay"},
      {img:"TempleWebsite/images/p16.jpg", name:"K Chandu"},
      {img:"TempleWebsite/images/p17.jpg", name:"Nandu"},
      {img:"TempleWebsite/images/p18.jpg", name:"M Chandu"},
      {img:"TempleWebsite/images/p19.jpg", name:"Goutham"},
      {img:"TempleWebsite/images/p20.jpg", name:"Punith"},
      {img:"TempleWebsite/images/p21.jpg", name:"Yaswanth"},
      {img:"TempleWebsite/images/p22.jpg", name:"T Praveen"},
      
  
    ],
    donations:["Ramesh - ₹700"],
    bills:["Decoration - ₹800"]
  }
}

};

/* LOAD FESTIVALS */
function loadFestivals() {
  const year = document.getElementById("year").value;
  const fest = document.getElementById("festival");

  fest.innerHTML = "";

  Object.keys(data[year]).forEach(f=>{
    let opt = document.createElement("option");
    opt.value = f;
    opt.text = f;
    fest.appendChild(opt);
  });

  loadData();
}

/* LOAD DATA */
function loadData() {

  const year = document.getElementById("year").value;
  const fest = document.getElementById("festival").value;

  const d = data[year][fest];

  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  d.items.forEach(item=>{

    const div = document.createElement("div");

    if(item.type==="cat"){
      div.className="category "+item.class;
      div.innerText=item.text;
    } else {
      div.className="card";

      const img = document.createElement("img");
      img.src = item.img;

      const name = document.createElement("p");
      name.innerText=item.name;

      div.appendChild(img);
      div.appendChild(name);
    }

    grid.appendChild(div);
  });

  /* DONATIONS */
  const don = document.getElementById("donations");
  don.innerHTML="";
  d.donations.forEach(x=>{
    let li=document.createElement("li");
    li.innerText=x;
    don.appendChild(li);
  });

  /* BILLS */
  const bill = document.getElementById("bills");
  bill.innerHTML="";
  d.bills.forEach(x=>{
    let li=document.createElement("li");
    li.innerText=x;
    bill.appendChild(li);
  });

}

/* DEFAULT LOAD */
window.onload=()=>{
  loadFestivals();
};

</script>

</body>
</html>
