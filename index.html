<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<title>రాఘవరాజపురం</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f5f5f5;
}

/* HEADER */
header {
  background: orange;
  color: white;
  text-align: center;
  padding: 15px;
  font-size: 22px;
}

/* NAVBAR */
nav {
  background: #ddd;
  padding: 10px;
  text-align: center;
}

nav a {
  margin: 10px;
  font-weight: bold;
  color: blue;
  text-decoration: none;
}

/* SECTIONS */
section {
  margin: 10px;
}

/* GRID DESIGN (IMAGE LAANTI) */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 10px;
}

/* CARD */
.card {
  background: white;
  border-radius: 8px;
  text-align: center;
  padding: 5px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.card img {
  width: 100%;
  height: 100px;
  object-fit: cover;
  border-radius: 6px;
}

.card p {
  font-size: 12px;
  margin: 5px 0;
}

/* CATEGORY BOX */
.category {
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  color: white;
  height: 100px;
  border-radius: 8px;
}

.fellow { background: orange; }
.master { background: skyblue; }
.architect { background: #1976d2; }
.tech { background: #ff7043; }

</style>
</head>

<body>

<header>
🙏 రాఘవరాజపురం హిందూ కుటుంబానికి స్వాగతం 🙏
</header>

<nav>
<a href="#">Year</a>
<a href="#">Festivals</a>
<a href="#">Photos</a>
<a href="#">Videos</a>
<a href="#">Donations</a>
<a href="#">Bills</a>
</nav>

<!-- TOP CONTENT -->
<section>
<h3>Select Year</h3>
<button onclick="loadPhotos()">Load Photos</button>
</section>

<!-- BOTTOM GRID (MAIN UI) -->
<section>
<div id="photos" class="grid"></div>
</section>

<script>

function loadPhotos() {

  const div = document.getElementById("photos");
  div.innerHTML = "";

  const items = [

    {type:"cat", text:"FELLOW", class:"fellow"},
    {img:"images/p1.jpg", name:"Person 1"},
    {img:"images/p2.jpg", name:"Person 2"},
    {type:"cat", text:"ARCHITECT", class:"architect"},

    {type:"cat", text:"MASTERS", class:"master"},
    {img:"images/p3.jpg", name:"Person 3"},
    {img:"images/p4.jpg", name:"Person 4"},

    {img:"images/p5.jpg", name:"Person 5"},
    {img:"images/p6.jpg", name:"Person 6"},
    {img:"images/p7.jpg", name:"Person 7"},
    {img:"images/p8.jpg", name:"Person 8"},

  ];

  items.forEach(item => {

    const card = document.createElement("div");

    if(item.type === "cat") {
      card.className = "category " + item.class;
      card.innerText = item.text;
    } else {
      card.className = "card";

      const img = document.createElement("img");
      img.src = item.img;

      const name = document.createElement("p");
      name.innerText = item.name;

      card.appendChild(img);
      card.appendChild(name);
    }

    div.appendChild(card);

  });

}

</script>

</body>
</html>
