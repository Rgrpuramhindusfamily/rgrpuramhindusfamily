<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<title>Temple UI</title>

<style>
body { font-family: Arial; margin:0; background:#eee; }

/* HEADER */
header {
  background: orange;
  color:white;
  text-align:center;
  padding:15px;
  font-size:22px;
}

/* NAV */
nav {
  background:#ccc;
  text-align:center;
  padding:10px;
}
nav a {
  margin:10px;
  color:blue;
  font-weight:bold;
}

/* MAIN LAYOUT */
.main {
  display:flex;
}

/* LEFT PANEL */
.left {
  width:250px;
  padding:10px;
}

/* RIGHT PANEL */
.right {
  flex:1;
  padding:10px;
}

/* GRID */
.grid {
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(120px,1fr));
  gap:10px;
}

/* CARD */
.card {
  background:white;
  padding:5px;
  border-radius:10px;
  text-align:center;
}

.card img {
  width:100%;
  height:100px;
  object-fit:cover;
  border-radius:8px;
}

.category {
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
  font-weight:bold;
  height:100px;
  border-radius:10px;
}

.fellow { background:orange; }
.master { background:skyblue; }
.architect { background:#1976d2; }
.tech { background:#ff7043; }

select { padding:5px; margin:5px; }

</style>
</head>

<body>

<header>
🙏 రాఘవరాజపురం హిందూ కుటుంబానికి స్వాగతం 🙏
</header>

<nav>
<a>Families</a>
<a>Year</a>
<a>Festivals</a>
<a>Photos</a>
<a>Videos</a>
<a>Donations</a>
<a>Bills</a>
</nav>

<div class="main">

<!-- LEFT SIDE -->
<div class="left">

<h3>Select Year</h3>

<select id="year" onchange="loadFestivals()">
<option value="2025">2025</option>
<option value="2026">2026</option>
</select>

<select id="festival" onchange="loadData()">
<option>Select Festival</option>
</select>

<h3>Donations</h3>
<ul id="donations"></ul>

<h3>Bills</h3>
<ul id="bills"></ul>

</div>

<!-- RIGHT SIDE -->
<div class="right">
<div id="grid" class="grid"></div>
</div>

</div>

<script>

/* 🔥 MAIN DATA */
const data = {

"2025": {
  "Vinayaka": {
    items: [
      {img:"images/p1.jpg.jpg", name:"Jyothish"},
      {img:"images/p2.jpg.jpg", name:"Kishore"},
      {img:"images/p3.jpg.jpg", name:"Praveen"},
      {img:"images/p4.jpg.jpg", name:"Naveen"},
      {img:"images/p5.jpg.jpg", name:"Umakanth"},
      {img:"images/p6.jpg.jpg", name:"Kiran"},
      {img:"images/p7.jpg.jpg", name:"Ambareesh"},
      {img:"images/p8.jpg.jpg", name:"Mothi"},
      {img:"images/p9.jpg.jpg", name:"Gokul"},
      {img:"images/p10.jpg.jpg", name:"Narendra"},
      {img:"images/p11.jpg.jpg", name:"Thulasi"},
      {img:"images/p12.jpg.jpg", name:"Sarath"},
      {img:"images/p13.jpg.jpg", name:"Anji"},
      {img:"images/p14.jpg.jpg", name:"Nithin"},
      {img:"images/p15.jpg.jpg", name:"Vinay"},
      {img:"images/p16.jpg.jpg", name:"K Chandu"},
      {img:"images/p17.jpg.jpg", name:"Nandu"},
      {img:"images/p18.jpg.jpg", name:"M Chandu"},
      {img:"images/p19.jpg.jpg", name:"Goutham"},
      {img:"images/p20.jpg.jpg", name:"Punith"},
      {img:"images/p21.jpg.jpg", name:"Yaswanth"},
      {img:"images/p22.jpg.jpg", name:"T Praveen"},
      {img:"images/p23.jpg", name:"Jyothish"}
  
    ],
    donations:["Ramesh - ₹700"],
    bills:["Decoration - ₹800"]
  }
}

};

/* LOAD FESTIVALS */
function loadFestivals() {
  const year = document.getElementById("year").value;
  const fest = document.getElementById("festival");

  fest.innerHTML = "";

  Object.keys(data[year]).forEach(f=>{
    let opt = document.createElement("option");
    opt.value = f;
    opt.text = f;
    fest.appendChild(opt);
  });

  loadData();
}

/* LOAD DATA */
function loadData() {

  const year = document.getElementById("year").value;
  const fest = document.getElementById("festival").value;

  const d = data[year][fest];

  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  d.items.forEach(item => {

    /* 🔥 CARD CREATE */
    const card = document.createElement("div");
    card.className = "card";

    /* IMAGE */
    const img = document.createElement("img");
    img.src = item.img;

    /* NAME */
    const name = document.createElement("p");
    name.innerText = item.name;

    /* APPEND */
    card.appendChild(img);
    card.appendChild(name);

    grid.appendChild(card);

  });

  /* DONATIONS */
  const don = document.getElementById("donations");
  don.innerHTML="";
  d.donations.forEach(x=>{
    let li=document.createElement("li");
    li.innerText=x;
    don.appendChild(li);
  });

  /* BILLS */
  const bill = document.getElementById("bills");
  bill.innerHTML="";
  d.bills.forEach(x=>{
    let li=document.createElement("li");
    li.innerText=x;
    bill.appendChild(li);
  });

}
}

/* DEFAULT LOAD */
window.onload=()=>{
  loadFestivals();
};

</script>

</body>
</html>
